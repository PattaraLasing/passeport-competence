<ion-content>
    <ion-button routerLink="/admin">Admin</ion-button>
    <ion-button routerLink="/connexion">Connexion</ion-button>
    <ion-button routerLink="/vitrine">Vitrine</ion-button>
    <ion-button routerLink="/skill">Compétence</ion-button>
    <ion-button routerLink="/experience">Expérience</ion-button>
    <div [formGroup]="experienceForm">
        <div class="zone" formGroupName="header">
            <h2>Header Zone</h2>
            <ion-input label="Titre" formControlName="title"></ion-input>
            <ion-input label="Date" formControlName="date"></ion-input>
            <ion-input label="Lieu" formControlName="location"></ion-input>
            <ion-input label="Participants" formControlName="participants"></ion-input>
        </div>
        <div class="zone" formGroupName="star">
            <h2>STAR Zone</h2>
            <ion-input label="Situation" formControlName="situation"></ion-input>
            <ion-input label="Tâche" formControlName="task"></ion-input>
            <ion-input label="Action" formControlName="action"></ion-input>
            <ion-input label="Résultat" formControlName="result"></ion-input>
        </div>
        <div class="zone" formGroupName="evidence">
            <h2>Evidence Zone</h2>
            <ion-input label="Genre" formControlName="genre"></ion-input>
            <ion-input label="Titre" formControlName="name"></ion-input>
            <ion-input label="Description" formControlName="description"></ion-input>
        </div>
        <ion-button (click)="saveExperience()">Enregistrer</ion-button>
    </div>
</ion-content>
