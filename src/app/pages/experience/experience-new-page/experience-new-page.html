<ion-content>

  <!-- MODAL : DATE PICKER -->
  <ion-modal class="datetime-modal" [isOpen]="dateStartModal()" (willDismiss)="dateStartModal.set(false)">
    <ng-template>
      <ion-datetime presentation="date" [showDefaultButtons]="true" doneText="Terminer" cancelText="Annuler"
        (ionChange)="getDateStart($event)" formControlName="dateStart">
      </ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal class="datetime-modal" [isOpen]="dateEndModal()" (willDismiss)="dateEndModal.set(false)">
    <ng-template>
      <ion-datetime presentation="date" [showDefaultButtons]="true" doneText="Terminer" cancelText="Annuler"
        (ionChange)="getDateEnd($event)" formControlName="dateEnd">
      </ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-grid class="fullHeight">

    <!-- MAIN TITLE -->
    <ion-row>
      <ion-title>
        <h3>Ajouter une nouvelle expérience</h3>
      </ion-title>
    </ion-row>

    <!-- MAIN CONTENT -->
    <ion-row class="fullHeight">
      <ion-col class="main-content">

        <!-- BOX SHADOW -->
        <ion-row class="box-shadow">
          <ion-col>

            <!-- EXPERIENCE FORM -->
            <div [formGroup]="experienceForm">

              <!-- HEADER -->
              <div formGroupName="header">
                <ion-row>

                  <ion-col>
                    <ion-item>
                      <ion-input label="Titre" label-placement="floating" formControlName="title"></ion-input>
                    </ion-item>

                    <ion-item>
                      <ion-input label="Lieu" label-placement="floating" formControlName="location"></ion-input>
                    </ion-item>

                    <ion-item>
                      <ion-input label="Participants" label-placement="floating"
                        formControlName="participants"></ion-input>
                    </ion-item>
                  </ion-col>

                  <ion-col size="4">
                    <ion-item>
                      <ion-input label-placement="floating" label="Date début" formControlName="dateStart"></ion-input>
                      <ion-button fill="clear" slot="end" (click)="dateStartModal.set(true)">
                        <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
                      </ion-button>
                    </ion-item>

                    <ion-item>
                      <ion-input label-placement="floating" label="Date fin" formControlName="dateEnd"></ion-input>
                      <ion-button fill="clear" slot="end" (click)="dateEndModal.set(true)">
                        <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
                      </ion-button>
                    </ion-item>
                  </ion-col>

                </ion-row>
              </div>

              <!-- SEGMENT BUTTONS -->
              <ion-segment value="star-segment">
                <ion-segment-button value="star-segment" content-id="star-segment">
                  <ion-label>STAR</ion-label>
                </ion-segment-button>
                <ion-segment-button value="note-segment" content-id="note-segment">
                  <ion-label>Note</ion-label>
                </ion-segment-button>
                <ion-segment-button value="evidences-segment" content-id="evidences-segment">
                  <ion-label>Preuves</ion-label>
                </ion-segment-button>
              </ion-segment>

              <!-- SEGMENT VIEWS -->
              <ion-segment-view>

                <!-- SEGMENT VIEWS : STAR -->
                <ion-segment-content id="star-segment">
                  <div formGroupName="star" class="segment-content-item">

                    <ion-textarea label-placement="floating" [autoGrow]="true" formControlName="situation">
                      <div slot="label"> <ion-text color="medium">Situation</ion-text> </div>
                    </ion-textarea>

                    <ion-textarea label-placement="floating" [autoGrow]="true" formControlName="task">
                      <div slot="label"> <ion-text color="medium">Tâche</ion-text> </div>
                    </ion-textarea>

                    <ion-textarea label-placement="floating" [autoGrow]="true" formControlName="action">
                      <div slot="label"> <ion-text color="medium">Action</ion-text> </div>
                    </ion-textarea>

                    <ion-textarea label-placement="floating" [autoGrow]="true" formControlName="result">
                      <div slot="label"> <ion-text color="medium">Résultat</ion-text> </div>
                    </ion-textarea>

                  </div>
                </ion-segment-content>

                <!-- SEGMENT VIEWS : NOTE -->
                <ion-segment-content id="note-segment">
                  <ion-textarea label-placement="floating" [autoGrow]="true" style="height: 100%;"
                    formControlName="note">
                    <div slot="label"> <ion-text color="medium">Note</ion-text> </div>
                  </ion-textarea>
                </ion-segment-content>

                <!-- SEGMENT VIEWS : Evidences -->
                <ion-segment-content id="evidences-segment">
                  <div [formGroup]="evidencesForm" style="width: 100%;">

                    <ion-button color="secondary" (click)="addEvidenceForm()">
                      <ion-icon slot="start" name="add-circle-outline"></ion-icon>Ajouter un fichier
                    </ion-button>

                    <!-- Evidences DETAILS -->
                    <div formArrayName="evidences">

                      <ion-row>
                        @for (evidence of evidences.controls; track $index) {
                        <div [formGroupName]="$index" style="width: 100%;">

                          <ion-card>
                            <ion-row>

                              <ion-col>
                                <ion-item lines="none">
                                  <input (change)="onEvidenceFileSelected($event, $index)" type="file" />

                                </ion-item>
                                <ion-item>
                                  <ion-input label="Nom" label-placement="floating" formControlName="name"></ion-input>
                                </ion-item>
                                <ion-item style="margin-bottom: 1em;">
                                  <ion-input label="Description" label-placement="floating"
                                    formControlName="description">
                                  </ion-input>
                                </ion-item>

                              </ion-col>

                              <ion-col size="1">

                                <ion-item lines="none">
                                  <ion-button slot="end" color="secondary" fill="clear"
                                    (click)="removeEvidenceForm($index)">
                                    <ion-icon name="close-circle-outline"></ion-icon>
                                  </ion-button>
                                </ion-item>

                              </ion-col>

                            </ion-row>

                          </ion-card>

                        </div>
                        }
                      </ion-row>

                    </div>

                  </div>
                </ion-segment-content>

              </ion-segment-view>

              <!-- ADD BUTTON -->
              <ion-row class="ion-justify-content-end">
                <ion-button (click)="handleAddExperience()">Ajouter</ion-button>
              </ion-row>

            </div>

          </ion-col>
        </ion-row>

      </ion-col>
    </ion-row>

  </ion-grid>

</ion-content>
