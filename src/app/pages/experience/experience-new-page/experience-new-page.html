<ion-content>

  <!-- MODAL : DATE PICKER -->
  <ion-modal [isOpen]="dateStartModal()" (willDismiss)="dateStartModal.set(false)">
    <ng-template>
      <ion-datetime (ionChange)="getDateStart($event)" formControlName="dateStart"></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal [isOpen]="dateEndModal()" (willDismiss)="dateEndModal.set(false)">
    <ng-template>
      <ion-datetime (ionChange)="getDateEnd($event)" formControlName="dateEnd"></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-grid class="fullHeight">

    <!-- MAIN TITLE -->
    <ion-row>
      <ion-title>
        <h3>Ajouter une nouvelle expérience</h3>
      </ion-title>
    </ion-row>

    <!-- MAIN CONTENT -->
    <ion-row class="fullHeight">
      <ion-col class="display-content">

        <!-- BOX SHADOW -->
        <ion-row class="box-shadow">
          <ion-col>

            <!-- EXPERIENCE FORM -->
            <div [formGroup]="experienceForm">

              <!-- HEADER -->
              <div formGroupName="header">
                <ion-row>

                  <ion-col>
                    <div>
                      <ion-item>
                        <ion-input label="Titre" label-placement="floating" formControlName="title"></ion-input>
                      </ion-item>

                      <ion-item>
                        <ion-input label="Lieu" label-placement="floating" formControlName="location"></ion-input>
                      </ion-item>

                      <ion-item>
                        <ion-input label="Participants" label-placement="floating"
                          formControlName="participants"></ion-input>
                      </ion-item>
                    </div>
                  </ion-col>

                  <ion-col size="4">
                    <div>
                      <ion-item>
                        <ion-input label-placement="floating" label="Date début"
                          formControlName="dateStart"></ion-input>
                        <ion-button fill="clear" slot="end" (click)="dateStartModal.set(true)">
                          <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
                        </ion-button>
                      </ion-item>

                      <ion-item>
                        <ion-input label-placement="floating" label="Date fin" formControlName="dateEnd"></ion-input>
                        <ion-button fill="clear" slot="end" (click)="dateEndModal.set(true)">
                          <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
                        </ion-button>
                      </ion-item>
                    </div>
                  </ion-col>

                </ion-row>
              </div>

              <!-- SEGMENT BUTTONS -->
              <ion-row>
                <ion-segment value="star">
                  <ion-segment-button value="star" content-id="star">
                    <ion-label>STAR</ion-label>
                  </ion-segment-button>
                  <ion-segment-button value="note" content-id="note">
                    <ion-label>Note</ion-label>
                  </ion-segment-button>
                  <ion-segment-button value="files" content-id="files">
                    <ion-label>Fichiers</ion-label>
                  </ion-segment-button>
                </ion-segment>
              </ion-row>

              <!-- SEGMENT VIEWS -->
              <ion-segment-view>

                <!-- SEGMENT VIEWS : STAR -->
                <ion-segment-content id="star">
                  <div formGroupName="star">

                    <ion-row>
                      <ion-col>
                        <ion-item class="star-textarea" lines="full">
                          <ion-textarea label="Situation" label-placement="floating" formControlName="situation">
                          </ion-textarea>
                        </ion-item>
                      </ion-col>
                      <ion-col>
                        <ion-item>
                          <ion-textarea label="Tâche" label-placement="floating" formControlName="task"></ion-textarea>
                        </ion-item>
                      </ion-col>
                    </ion-row>

                    <ion-row>
                      <ion-col>
                        <ion-item>
                          <ion-textarea label="Action" label-placement="floating"
                            formControlName="action"></ion-textarea>
                        </ion-item>
                      </ion-col>
                      <ion-col>
                        <ion-item>
                          <ion-textarea label="Résultat" label-placement="floating"
                            formControlName="result"></ion-textarea>
                        </ion-item>
                      </ion-col>
                    </ion-row>

                  </div>
                </ion-segment-content>

                <!-- SEGMENT VIEWS : NOTE -->
                <ion-segment-content id="note">
                  Note
                </ion-segment-content>

                <!-- SEGMENT VIEWS : FILES -->
                <ion-segment-content id="files">
                  <div [formGroup]="evidencesForm">
                    <h2>Preuve</h2>
                    <div>
                      <ion-icon (click)="addEvidenceForm()" name="add-circle-outline"></ion-icon>
                    </div>

                    <div formArrayName="evidences">

                      @for (evidence of evidences.controls; track $index) {
                      <div [formGroupName]="$index">
                        <ion-list>
                          <ion-item>
                            <ion-input label="Titre" formControlName="name"></ion-input>
                          </ion-item>
                          <ion-item>
                            <ion-textarea label="Description" formControlName="description"></ion-textarea>
                          </ion-item>
                          <ion-item>
                            <input (change)="onEvidenceFileSelected($event, $index)" type="file" />
                          </ion-item>
                          <ion-icon (click)="removeEvidenceForm($index)" name="close-circle-outline"></ion-icon>
                        </ion-list>
                      </div>
                      }
                    </div>
                  </div>
                </ion-segment-content>

              </ion-segment-view>

              <!-- ADD BUTTON -->
              <ion-row class="ion-justify-content-end">
                <ion-button (click)="handleAddExperience()">Ajouter</ion-button>
              </ion-row>

            </div>

          </ion-col>
        </ion-row>

      </ion-col>
    </ion-row>

  </ion-grid>

</ion-content>
