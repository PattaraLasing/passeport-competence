<ion-content>

  @let skill = skillDetails();

  @if (skill) {

  <ion-grid class="fullHeight">

    <!-- MAIN TITLE -->
    <ion-row>
      <ion-title>
        <h3>{{skill.title}}</h3>
      </ion-title>
    </ion-row>


    <!-- MAIN CONTENT -->
    <ion-row class="fullHeight">
      <ion-col class="main-content">

        <!-- BOX SHADOW -->
        <ion-row class="box-shadow">

          <ion-col>

            <div>
              <div class="header">
                <ion-item>
                  <ion-input label="Description" label-placement="floating" [disabled]="true"
                    value="{{skill.description}}"></ion-input>
                </ion-item>
                <ion-item>
                  <ion-input label="Catégory" label-placement="floating" [disabled]="true"
                    value="{{skill.category}}"></ion-input>
                </ion-item>
              </div>

            </div>

          </ion-col>

        </ion-row>

      </ion-col>
    </ion-row>

  </ion-grid>
  }

</ion-content>
