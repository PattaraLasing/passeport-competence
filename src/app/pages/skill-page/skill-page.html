<ion-content>
    <ion-grid>
        <ion-row>
            <ion-button routerLink="/admin">Admin</ion-button>
            <ion-button routerLink="/vitrine">Vitrine</ion-button>
            <ion-button routerLink="/skill">Compétence</ion-button>
            <ion-button routerLink="/experience">Expérience</ion-button>
        </ion-row>
        <ion-row>
            <ion-col>
                <ion-button (click)="handleLoadSkill()">Afficher une compétence</ion-button>
            </ion-col>
        </ion-row>
        <ion-row>
            @for (skill of skills|async; track skill.uuid ) {
            <ion-col size="2">
                <ion-card>
                    <!-- <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" /> -->
                    <ion-card-header>
                        <ion-card-title>{{ skill.title }}</ion-card-title>
                        <ion-card-subtitle> {{skill.category}} </ion-card-subtitle>
                    </ion-card-header>

                    <ion-card-content> {{ skill.description }} <br> uuid : {{skill.uuid}} </ion-card-content>
                </ion-card>
            </ion-col>
            }
        </ion-row>
        <ion-row>
            <ion-col>
                <div [formGroup]="newSkillForm">
                    <div formGroupName="newSkill">
                        <h2>Ajouter une nouvelle compétence</h2>
                        <ion-input label="Titre" formControlName="title"></ion-input>
                        <ion-input label="Catégorie" formControlName="category"></ion-input>
                        <ion-input label="Description" formControlName="description"></ion-input>
                    </div>
                </div>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col>
                <ion-button (click)="handleAddSkill()">Ajouter une compétence</ion-button>
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
